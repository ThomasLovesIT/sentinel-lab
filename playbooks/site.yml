---
- name: Configure Linux servers
  hosts: linux
  become: yes
  tasks:
    - name: Ensure baseline packages are installed
      apt:
        name:
          - htop
          - curl
          - vim
          - unattended-upgrades
          - auditd
        state: present
        update_cache: yes

    - name: Enable automatic security updates
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Harden SSH - no root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: restart sshd

    - name: Install node_exporter for monitoring
      apt:
        name: prometheus-node-exporter
        state: present

    - name: Ensure node_exporter is running
      systemd:
        name: prometheus-node-exporter
        state: started
        enabled: yes

  handlers:
    - name: restart sshd
      systemd:
        name: ssh
        state: restarted
- name: Configure the domain controller
  hosts: windows
  tasks:
    - name: Ensure AD users exist
      microsoft.ad.user:
        name: "{{ item }}"
        password: "Passw0rd!2026"
        state: present
        path: "OU=LabUsers,DC=sentinel,DC=lab"
      loop:
        - labuser1
        - labuser2
        - labuser3
        - labuser4
        - labuser5
